apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: saludtotal-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: saludtotal-frontend
  template:
    metadata:
      labels:
        app: saludtotal-frontend
    spec:
      containers:
      - name: frontend
        image: your-docker-hub-username/saludtotal-frontend:latest # Update this with your image
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: NodePort
  selector:
    app: saludtotal-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
